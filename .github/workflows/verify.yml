name: Verify archive

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEEPPROMPT_CHROME: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Check reproducibility and annotations
        run: |
          python3 scripts/rebuild_archive.py --check
          python3 scripts/audit_annotation_coverage.py
          git diff --exit-code -- data/annotation-coverage.json
          python3 scripts/verify_archive.py
      - name: Run browser QA
        run: node scripts/browser_qa.mjs
